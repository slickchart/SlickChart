# (Moved 2026-11-16 from slickchart-vercel/.github/, where GitHub never saw it: workflows only run
# from the repo root's .github/workflows.)
#
# Builds the downloadable SlickChart desktop installers in the cloud — no Mac/Windows machine
# needed. GitHub runs the Mac build on a Mac and the Windows build on Windows, then hands you the
# finished .dmg and .exe.
#
# HOW TO RUN IT
#   • Easiest: GitHub → the "Actions" tab → "Build desktop apps" → "Run workflow".
#   • Or push a version tag to make a downloadable Release:
#       git tag desktop-v1.0.0 && git push origin desktop-v1.0.0
#
# WHERE THE FILES LAND
#   • Every run: scroll to the bottom of the run page → "Artifacts" → download the Mac/Windows zip.
#   • Tag runs (desktop-v*): also attached to a GitHub Release with clean download links.
#
# SIGNING (optional — builds work UNSIGNED with zero setup)
#   Add these repo secrets (Settings → Secrets and variables → Actions) to sign automatically:
#     Mac:      MAC_CSC_LINK (base64 of your Developer ID .p12), MAC_CSC_KEY_PASSWORD,
#               APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   (enables notarization)
#     Windows:  WIN_CSC_LINK (base64 of your code-signing .pfx), WIN_CSC_KEY_PASSWORD
#   With no secrets set, it still builds — the installers just show the OS "unidentified developer"
#   warning until you add signing.

name: Build desktop apps

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'desktop-v*'
    # Also build whenever the desktop shell itself changes on a branch, so a broken shell shows up
    # as a red check before anyone tries to install it. (Web-app changes don't need a desktop
    # rebuild: the shell loads the live site.)
    branches:
      - claude/friendly-dirac-n55456
    paths:
      - 'slickchart-vercel/desktop/**'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            script: build:mac
            pattern: slickchart-vercel/desktop/dist/*.dmg
          - os: windows-latest
            name: windows
            script: build:win
            pattern: slickchart-vercel/desktop/dist/*.exe
    runs-on: ${{ matrix.os }}
    env:
      HAS_SIGNING: ${{ secrets.CSC_LINK != '' }}
    timeout-minutes: 40
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        working-directory: slickchart-vercel/desktop
        run: npm install

      - name: Build the installer
        working-directory: slickchart-vercel/desktop
        shell: bash
        # An EMPTY CSC_LINK is read as a path (the folder itself) and fails "not a file", so drop the
        # signing variables when no certificate secret exists. An unsigned Mac app will not open at
        # all on Apple-chip Macs, so without a certificate the Mac build is signed ad hoc ("-"):
        # it opens after System Settings > Privacy & Security > Open Anyway. A Developer ID
        # certificate (secrets above) removes that step.
        run: |
          EXTRA=""
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            if [ "${{ matrix.name }}" = "mac" ]; then EXTRA="-c.mac.identity=- -c.mac.notarize=false"; fi
          fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npm run ${{ matrix.script }} -- $EXTRA
        env:
          # Mac signing + notarization (only used if the secrets exist; otherwise unsigned).
          CSC_LINK: ${{ (matrix.name == 'mac' && secrets.MAC_CSC_LINK) || (matrix.name == 'windows' && secrets.WIN_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ (matrix.name == 'mac' && secrets.MAC_CSC_KEY_PASSWORD) || (matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD) || '' }}
          # Skip code-signing entirely when no certificate secret is present, so unsigned builds
          # succeed on CI instead of failing to find an identity.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.name == 'mac' && secrets.MAC_CSC_LINK != '') || (matrix.name == 'windows' && secrets.WIN_CSC_LINK != '') }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: slickchart-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

      # Only SIGNED builds go on a Release. Without the signing secrets these are unsigned
      # copies; the public downloads (SlickChart-Mac.dmg / SlickChart-Windows-Setup.exe) are the
      # signed + notarized files built on Ashley's Mac (2026-11-16), and an unsigned copy beside
      # them only confuses visitors. Unsigned builds stay available as run artifacts above.
      - name: Attach to a Release (tag builds, signed only)
        if: startsWith(github.ref, 'refs/tags/desktop-v') && env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.pattern }}
          fail_on_unmatched_files: false
