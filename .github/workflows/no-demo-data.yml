name: No demo data in the product

# Sample data reached production once: a real client was shown another practitioner's name as her
# own esthetician, and new accounts started out branded as the demo studio. The sample dataset now
# lives only in scripts/demo-seed.js and demo-seed-client.js, which are injected into the public
# demos at build time. This check keeps it that way.

on:
  # Every branch, not just main. Since 2026-10-11 a change is tested on its own Vercel preview
  # and only promoted to main overnight (see deploy-at-2am.yml), and that promotion REFUSES a
  # commit with no green checks on it. If these sweeps only ran on main they would run after the
  # deploy they are meant to gate.
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: No placeholder people in anything a provider or client loads
        working-directory: slickchart-vercel
        run: node scripts/check-no-demo-data.cjs

      - name: Build stamp agrees between the app and the server
        working-directory: slickchart-vercel
        run: node scripts/check-build-stamp.cjs

      # A loader that reads synced data but is not re-run after a cloud pull means a change made on
      # one device lands on another device's disk and never reaches its screen. That is what made a
      # course vanish, and what made a form made on her phone refuse to show on her computer.
      - name: Every synced library is re-read after a cloud pull
        working-directory: slickchart-vercel
        run: node scripts/check-reload-coverage.cjs

      # CLAUDE.md §0.6: a synced key that accumulates data must merge on pull, never plain-overwrite,
      # or a stale device can wipe newer data from another one.
      - name: No new accumulating key joins the plain-overwrite path
        working-directory: slickchart-vercel
        run: node scripts/check-merge-coverage.cjs

      # CLAUDE.md §0.1: identity comes from the verified session token, never from a field in the
      # request, and every query against a per-provider table is scoped to its owner. A shared token
      # once put one provider's data in another's account; this makes a repeat mechanically visible.
      - name: Every endpoint scopes data to the authenticated caller
        working-directory: slickchart-vercel
        run: node scripts/check-tenant-isolation.cjs

      # A booking day is a day in the SHOP's timezone, never the server's. Vercel runs in UTC, so
      # parsing the date there asked Square for 5pm the previous day through 4:59pm the requested
      # one — every evening slot silently missing. Both DST days are asserted too: the first fix
      # sampled one offset for the whole day and got a 25-hour day wrong. SESSION-HANDOFF §2ap.
      - name: Square availability searches the shop's own day
        working-directory: slickchart-vercel
        run: node scripts/check-square-daywindow.cjs

      # Run the SAME script CLAUDE.md §3 tells a contributor to run before committing, rather than
      # a hand-copied list of build steps. The copy had drifted: it ran four builders and missed
      # build-feature-map.cjs, so a stale FEATURES.md passed CI even though §1c rule 4 says this
      # check is what makes it impossible. FEATURES.md being wrong is how a provider gets told her
      # photos are gone when they are on the server, so it is not a cosmetic generated file.
      - name: Generated files are in sync with their sources
        working-directory: slickchart-vercel
        run: node scripts/check-generated.cjs

      # CLAUDE.md §0b: Ashley's paid sign-up push broke four times, each time silently, and each time
      # it took her a day of tests and screenshots to get back. These are the server-side paths it
      # broke on: every founder account and every device gets the alert, a refused phone address is
      # named and replaced, a client link can't take her phone's alerts, and the owner-key status read
      # never returns a token. Stubbed (no network, no database, no npm install).
      - name: Founder sign-up alerts reach every one of her devices
        run: |
          for f in run build-sale test-push-devices founder-accounts test-push-rejected native-push-validate native-push-client-guard push-state; do
            echo "== $f"; node scratchpad/founder-push/$f.mjs || exit 1
          done
