<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SlickChart</title>
<style>
  html,body{margin:0;height:100%;background:#0d0d0d;color:#e8ddd0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;box-sizing:border-box;}
  .logo{width:64px;height:64px;border-radius:16px;background:#2BC7AC;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;color:#1a1408;}
  h1{font-size:19px;font-weight:600;margin:6px 0 0;}
  p{font-size:14px;color:#a89a8a;line-height:1.5;max-width:280px;margin:0;}
  button{margin-top:8px;background:#2BC7AC;color:#03201E;border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
  <!-- Shown (server.errorPath) when the live app at server.url cannot load: no signal at launch, or a
       server error. Normally the native shell loads the live app, so every web deploy updates the app
       instantly with no re-submission. Retry goes to the live app, not back to this page. -->
  <script>
    // Tell the server this page showed (lib/app-launch-log.js). When the signal is really gone this
    // fails quietly; when it arrives, the app showed this page while the internet worked, which is a bug
    // to fix, not a connection problem. text/plain + no-cors: no preflight from the app's local page.
    try{fetch('https://slickchart.app/api/app-launch',{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({device:'offline-'+Math.random().toString(36).slice(2,10),platform:'app',os:(navigator.userAgent.match(/OS (\d+[_\d]*) like Mac/)||navigator.userAgent.match(/Android ([\d.]+)/)||['',''])[1].replace(/_/g,'.'),build:'shell',
      events:[{t:Date.now(),e:'offline-page-shown',d:navigator.onLine?'phone says online':'phone says offline'}]})}).catch(function(){});}catch(e){}
  </script>
  <div class="wrap">
    <div class="logo">S</div>
    <h1>Can't open SlickChart right now</h1>
    <p>Check your internet connection and try again. Your clients and notes are safe on your account.</p>
    <button onclick="location.href='https://slickchart.app/slickchart'">Try again</button>
  </div>
</body>
</html>
