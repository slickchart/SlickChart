<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:900px;overflow:hidden;font-family:"DM Sans",sans-serif;
 background:radial-gradient(120% 90% at 0% 0%,#eef6f2 0%,#e6f2ec 55%,#d9eee6 100%);color:#0f3b30;position:relative}
.left{position:absolute;left:80px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:34px}
.brand img{width:78px;height:78px}
.word{font-weight:700;font-size:54px;letter-spacing:-.5px;color:#0f3b30}.word b{color:#169a7f;font-weight:700}
.pill{background:#0f3b30;color:#fff;border-radius:999px;padding:14px 28px;font-weight:700;letter-spacing:4px;font-size:19px;display:flex;align-items:center;gap:14px;margin-bottom:34px}
.pill i{width:11px;height:11px;border-radius:50%;background:#2ec4a0;display:block}
h1{font-family:"Playfair Display",serif;font-weight:700;font-size:76px;line-height:1.02;letter-spacing:-1.5px;color:#0f3b30}
h1 em{display:block;font-style:italic;color:#139279}
.url{margin-top:34px;font-weight:500;font-size:30px;letter-spacing:.5px;color:#0f3b30}
.phone{position:absolute;right:70px;top:70px;width:390px;height:900px;border:12px solid #141a18;border-bottom:none;border-radius:58px 58px 0 0;overflow:hidden;background:#fff;box-shadow:0 30px 70px rgba(15,59,48,.22)}
.phone img{width:100%;display:block}
</style></head><body>
<div class="left">
 <div class="brand"><img src="logo.png"><div class="word">Slick<b>Chart</b></div></div>
 <div class="pill"><i></i>__PILL__</div>
 <h1>__H1__<em>__H2__</em></h1>
 <div class="url">slickchart.app</div>
</div>
<div class="phone"><img src="__IMG__"></div>
</body></html>
