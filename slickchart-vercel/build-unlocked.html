<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your access | Build Your Own App</title>
<meta name="description" content="Your Build Your Own App access page.">
<link rel="canonical" href="https://slickchart.app/build/unlocked">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050f10">
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SlickChart">
<meta property="og:title" content="Your access | Build Your Own App">
<meta property="og:description" content="Your Build Your Own App access page.">
<meta property="og:url" content="https://slickchart.app/build/unlocked">
<meta property="og:image" content="https://slickchart.app/assets/og-image-marine.jpg?v=4">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050f10;--bg2:#020909;--panel:#0e1f1d;--line:#20423c;--ink:#eaf6f4;--muted:#a2beb9;--muted2:#7a948f;
--gold:#2bc7ac;--green:#5fd99f;--edge:rgba(43,199,172,.2);
--opal-btn:linear-gradient(135deg,#19b8bf 0%,#2bc7a2 52%,#6fdca6 100%);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.75 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 22px}
header.site{border-bottom:1px solid var(--line);background:var(--bg2)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px}
.brand{display:flex;align-items:center;gap:9px;font:600 18px Inter,sans-serif;color:var(--ink);text-decoration:none}
.brand img{width:28px;height:28px}
.brandc{color:var(--gold)}
main{padding:44px 0 20px}
h1{font:600 clamp(29px,5.4vw,44px)/1.2 Fraunces,Georgia,serif;margin:0 0 16px;letter-spacing:-.01em}
h2{font:600 clamp(21px,3.4vw,27px)/1.35 Fraunces,Georgia,serif;margin:40px 0 12px}
p{margin:0 0 18px;color:#dbeae7}
a{color:var(--gold)}
ul{margin:0 0 18px;padding-left:22px;color:#dbeae7}li{margin-bottom:10px}
.lede{font-size:19.5px;color:var(--muted);margin-bottom:26px}
.panel{border:1px solid var(--edge);background:var(--panel);border-radius:16px;padding:22px 24px;margin:26px 0}
.buy{display:block;width:100%;background:var(--opal-btn);color:#03201e;font:700 17px Inter,sans-serif;border:none;
  padding:17px;border-radius:12px;cursor:pointer;text-align:center;text-decoration:none;font-family:inherit}
.buy[disabled]{opacity:.6;cursor:default}
.price{font:600 34px Fraunces,Georgia,serif;color:var(--ink)}
.price small{font:400 15px Inter,sans-serif;color:var(--muted2);margin-left:8px}
.tiny{font-size:13.5px;color:var(--muted2);line-height:1.6}
.err{background:#2a1206;border:1px solid #6b4a1e;color:#f0c98a;border-radius:10px;padding:13px 15px;font-size:14.5px;line-height:1.6;margin:18px 0}
.step{display:flex;gap:14px;margin-bottom:20px}
.num{width:28px;height:28px;border-radius:50%;background:var(--opal-btn);color:#03201e;font:700 14px Inter,sans-serif;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px}
.vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--edge)}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
footer{border-top:1px solid var(--line);background:var(--bg2);margin-top:56px;padding:28px 0}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:center}
footer a{color:var(--muted);font-size:14px;text-decoration:none}
@media (max-width:520px){.panel{padding:18px 17px}}
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="/"><img src="/assets/slickchart-logo.png" alt="" width="28" height="28"><span>Slick<span class="brandc">Chart</span></span></a>
</div></header>

<main><div class="wrap">
<div id="body">
  <h1>Checking your purchase…</h1>
  <p class="lede">One moment.</p>
</div>
</div></main>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Turn a YouTube/Vimeo link into an embed; anything else that looks like a video file plays inline,
// and anything we don't recognise becomes a plain link rather than a broken player.
function player(u){
  var m=/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/.exec(u);
  if(m)return '<div class="vid"><iframe src="https://www.youtube.com/embed/'+esc(m[1])+'?rel=0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;picture-in-picture;fullscreen" allowfullscreen title="Start here"></iframe></div>';
  m=/vimeo\.com\/(?:video\/)?(\d+)/.exec(u);
  if(m)return '<div class="vid"><iframe src="https://player.vimeo.com/video/'+esc(m[1])+'" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen title="Start here"></iframe></div>';
  if(/\.(mp4|mov|m4v|webm)(\?|$)/i.test(u))return '<div class="vid"><video src="'+esc(u)+'" controls playsinline preload="metadata"></video></div>';
  return '<p><a class="buy" href="'+esc(u)+'" target="_blank" rel="noopener">Watch the intro video</a></p>';
}
function fail(msg){
  document.getElementById('body').innerHTML='<h1>We couldn\u2019t open this</h1>'
    +'<div class="err">'+esc(msg)+'</div>'
    +'<p class="tiny">If you were charged, you have access \u2014 email <a href="mailto:hello@slickchart.app">hello@slickchart.app</a> with this page\u2019s address and I\u2019ll send your links straight over.</p>';
}
(function(){
  var sid='';try{sid=new URLSearchParams(location.search).get('session_id')||'';}catch(e){}
  if(!sid){fail('This page opens from the link you get after buying. Check your email for it \u2014 the subject is \u201cYour Build Your Own App access\u201d.');return;}
  fetch('/api/build-unlock?session_id='+encodeURIComponent(sid))
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      var j=res.j||{};
      if(!res.ok||!j.ok){fail(j.error||'We couldn\u2019t confirm that purchase.');return;}
      document.getElementById('body').innerHTML=
        '<h1>You\u2019re in</h1>'
        +'<p class="lede">Everything\u2019s below'+(j.email?(' \u2014 and on its way to '+esc(j.email)):'')+'. Keep that email; it\u2019s your way back to this page any time.</p>'
        +'<div class="step"><div class="num">1</div><div><h2 style="margin:0 0 8px;">Watch this first</h2>'
        +'<p>It\u2019s short, and it\u2019s the part that saves you from starting in the wrong place.</p>'+player(j.videoUrl)+'</div></div>'
        +'<div class="step" style="margin-top:34px;"><div class="num">2</div><div><h2 style="margin:0 0 8px;">Open the system</h2>'
        +'<p>This is where the whole thing lives. <b>Pin it in Claude the moment it opens</b> \u2014 use the menu on the page and choose Pin, and it lives in your sidebar from then on instead of getting lost in old chats.</p>'
        +'<p><a class="buy" href="'+esc(j.artifactUrl)+'" target="_blank" rel="noopener">Open Build Your Own App &rarr;</a></p>'
        // Most buyers live in the Claude desktop app, and the link above opens in a browser. These are
        // the two things that actually bite: not knowing the pin carries across, and losing ticks by
        // starting in one place and continuing in another (the checklist saves where you tick it).
        +'<div class="panel" style="margin:18px 0 0;padding:16px 18px;">'
        +'<p style="margin:0 0 8px;font-size:15px;"><b>Using the Claude desktop app?</b></p>'
        +'<p class="tiny" style="margin:0 0 9px;">Pinning is saved to your Claude <b>account</b>, not to this browser. Pin it once \u2014 here or there \u2014 and it\u2019s in your sidebar in the desktop app too, as long as you\u2019re signed in to the same account. There is nothing to download and nothing to install.</p>'
        +'<p class="tiny" style="margin:0;"><b>Then pick one place and stay in it.</b> Your ticks save where you tick them, so if you start in the desktop app, keep going there. Either way the link in your email reopens the page any time.</p>'
        +'</div></div></div>'
        +'<div class="panel"><p style="margin:0 0 8px;"><b>Stuck, or something not loading?</b></p>'
        +'<p class="tiny" style="margin:0;">Email <a href="mailto:hello@slickchart.app">hello@slickchart.app</a> and I\u2019ll answer you myself. Tell me where you got to and I\u2019ll get you moving.</p></div>';
    })
    .catch(function(){fail('Something went wrong on our end. Please refresh the page.');});
})();
</script>

<footer><div class="wrap">
  <a href="/">SlickChart</a><a href="/blog">Blog</a><a href="/terms">Terms</a><a href="/privacy">Privacy</a>
  <a href="mailto:hello@slickchart.app">Contact</a>
</div></footer>
</body>
</html>
