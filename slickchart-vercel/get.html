<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get SlickChart</title>
<meta name="theme-color" content="#0f8a7e">
<meta name="description" content="Download the SlickChart app — book, check in, and see your visit summaries, aftercare, and forms in one place.">
<!-- Link preview (texts, social, email) -->
<meta property="og:title" content="Get the SlickChart app">
<meta property="og:description" content="Book, check in, and see your visits, aftercare, and forms — all in one place.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://slickchart.app/get">
<meta property="og:image" content="https://slickchart.app/assets/slickchart-logo.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0b1512; --bg2:#0f1c18; --card:#12211c; --line:#1f3a31;
    --ink:#eaf5f0; --mut:#8fb3a8; --accent:#12b98a; --accent-ink:#04140f;
  }
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #123 0%, var(--bg) 55%), var(--bg);
    color:var(--ink); min-height:100%;
    display:flex; align-items:center; justify-content:center; padding:28px 18px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:400px; background:linear-gradient(180deg, var(--card) 0%, var(--bg2) 100%);
    border:1px solid var(--line); border-radius:22px; padding:34px 26px 30px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:18px;}
  .brand img{width:46px;height:46px;object-fit:contain;border-radius:11px;}
  .brand span{font-size:26px;font-weight:700;letter-spacing:-.01em;}
  .brand .c{color:var(--accent);}
  h1{font-size:20px;font-weight:600;margin-bottom:8px;line-height:1.3;}
  p.sub{font-size:14px;color:var(--mut);line-height:1.55;margin-bottom:24px;}
  .btns{display:flex;flex-direction:column;gap:11px;}
  a.store{
    display:flex;align-items:center;justify-content:center;gap:9px;
    background:var(--accent);color:var(--accent-ink);text-decoration:none;
    border-radius:13px;padding:15px 16px;font-size:15px;font-weight:700;
    transition:transform .08s ease, filter .15s ease;
  }
  a.store:active{transform:scale(.98);}
  a.store.alt{background:transparent;color:var(--ink);border:1px solid var(--line);}
  a.store svg{width:20px;height:20px;flex-shrink:0;}
  .redir{font-size:12.5px;color:var(--mut);margin-top:18px;min-height:16px;line-height:1.5;}
  .foot{font-size:11.5px;color:var(--mut);opacity:.75;margin-top:22px;line-height:1.5;}
  @media (prefers-color-scheme: light){
    :root{--bg:#eef5f2;--bg2:#f6faf8;--card:#ffffff;--line:#dce9e4;--ink:#12241d;--mut:#5c7c72;--accent:#0f9e77;--accent-ink:#ffffff;}
    body{background:radial-gradient(1200px 600px at 50% -10%, #dff0ea 0%, var(--bg) 55%), var(--bg);}
    .card{box-shadow:0 18px 50px rgba(20,60,45,.12);}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="/assets/slickchart-logo.png" alt="" onerror="this.style.display='none'">
      <span>Slick<span class="c">Chart</span></span>
    </div>
    <h1>Get the app</h1>
    <p class="sub">Book, check in, and see your visit summaries, aftercare, and forms — all in one place.</p>
    <div class="btns">
      <a class="store" id="apple" href="https://apps.apple.com/app/id6792418818" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.417 2.2-1.11 2.99-.833.94-2.19 1.66-3.32 1.57-.14-1.11.42-2.29 1.06-3.02.71-.82 2.02-1.44 3.13-1.54.02.14.24.29.24.99zM20.7 17.02c-.55 1.27-.81 1.83-1.52 2.95-.99 1.56-2.39 3.5-4.12 3.51-1.54.01-1.94-1.01-4.03-1-2.09.01-2.53 1.02-4.07 1.01-1.73-.02-3.05-1.77-4.04-3.33C.28 16.65-.35 11.5 1.61 8.83c1.34-1.82 3.46-2.89 5.45-2.89 2.03 0 3.3 1.11 4.98 1.11 1.63 0 2.62-1.11 4.97-1.11 1.77 0 3.65.96 4.99 2.63-4.38 2.4-3.67 8.65-1.3 8.45z"/></svg>
        Download on the App Store
      </a>
      <a class="store alt" id="play" href="https://play.google.com/store/apps/details?id=com.slickchart.app" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 1.8a1.5 1.5 0 0 0-.6 1.2v18a1.5 1.5 0 0 0 .6 1.2l10.2-10.2L3.6 1.8zm11.3 11.3 2.7 2.7-3.2 1.85-.03.02-2.6-1.5 3.13-3.07zm0-2.2L11.77 7.83l2.6-1.5 3.23 1.86-2.7 2.71zM18.9 9.4l2.5 1.45c.8.46.8 1.84 0 2.3L18.9 14.6 16 11.7l2.9-2.3z"/></svg>
        Get it on Google Play
      </a>
    </div>
    <div class="redir" id="redir"></div>
    <div class="foot">On an iPhone this opens the App Store; on Android it opens Google Play.</div>
  </div>
<script>
(function(){
  var APPLE = document.getElementById('apple').href;
  var PLAY  = document.getElementById('play').href;
  var ua = navigator.userAgent || navigator.vendor || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (/(Mac)/.test(ua) && 'ontouchend' in document); // iPadOS reports as Mac
  var isAndroid = /Android/i.test(ua);
  var redir = document.getElementById('redir');
  // Auto-send phones straight to their store; desktops keep both buttons. Use replace() so the back
  // button skips this hop. Show a manual link too in case the auto-redirect is blocked.
  if (isIOS || isAndroid) {
    var dest = isIOS ? APPLE : PLAY;
    var name = isIOS ? 'the App Store' : 'Google Play';
    redir.innerHTML = 'Opening ' + name + '…';
    // reorder so the matching store is the primary button
    if (isAndroid) {
      var play = document.getElementById('play'), apple = document.getElementById('apple');
      play.classList.remove('alt'); apple.classList.add('alt');
      play.parentNode.insertBefore(play, apple);
    }
    setTimeout(function(){ try { window.location.replace(dest); } catch(e){ window.location.href = dest; } }, 350);
  }
})();
</script>
</body>
</html>
